<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Tambahan - Bukpot Express</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button id="backBtn" class="back-btn" title="Kembali" aria-label="Kembali">&#8592;</button>
                <h1 class="header-title">Tools Tambahan</h1>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="theme-toggle" title="Toggle theme" aria-label="Ganti tema gelap/terang">
                    <span class="theme-icon" aria-hidden="true">&#127769;</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">Bukpot Rekap</span>
                </div>
                <p class="section-description">Tools tambahan untuk mengelola file bukti potong</p>
                <div class="tools-list">
                    <a href="https://www.bukpotrekap.id/app" target="_blank" class="tool-item" id="tool-ekstrak">
                        <div class="tool-icon tool-icon-extract">&#128194;</div>
                        <span class="tool-title">Ekstrak Bukti Potong BPPU/BPA1</span>
                        <span class="tool-arrow">&#8599;</span>
                    </a>
                    <a href="https://www.bukpotrekap.id/rename-bukpot" target="_blank" class="tool-item" id="tool-rename">
                        <div class="tool-icon tool-icon-rename">&#9999;</div>
                        <span class="tool-title">Rename Bukti Potong</span>
                        <span class="tool-arrow">&#8599;</span>
                    </a>
                    <a href="https://www.bukpotrekap.id/combine-excel" target="_blank" class="tool-item" id="tool-excel">
                        <div class="tool-icon tool-icon-excel">&#128200;</div>
                        <span class="tool-title">Gabungkan File Excel</span>
                        <span class="tool-arrow">&#8599;</span>
                    </a>
                    <a href="https://www.bukpotrekap.id/combine-pdf" target="_blank" class="tool-item" id="tool-pdf">
                        <div class="tool-icon tool-icon-pdf">&#128451;</div>
                        <span class="tool-title">Gabungkan File PDF</span>
                        <span class="tool-arrow">&#8599;</span>
                    </a>
                    <a href="https://alatpajak.my.id/kalkulator-pph-unifikasi.html" target="_blank" class="tool-item" id="tool-calculator">
                        <div class="tool-icon tool-icon-calc">&#128178;</div>
                        <span class="tool-title">Tax Summary & Invoice Tax Calculator</span>
                        <span class="tool-arrow">&#8599;</span>
                    </a>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <span class="footer-text">Gratis oleh <a href="https://alatpajak.id/" target="_blank" class="footer-link">alatpajak.id</a></span>
            <span class="footer-divider">&#183;</span>
            <a href="https://trakteer.id/alatpajakid/tip" target="_blank" class="footer-link">Dukung Kami</a>
        </footer>
    </div>

    <!-- App Scripts -->
    <script src="landing.js"></script>
</body>

</html>
